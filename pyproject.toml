[project]
name = "portfolio-manager"
version = "0.1.0"
description = "Dashboard to track, backtest and optimize DeGiro portfolios"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the project modules are imported from the repository root
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
# work in progress of the author, not part of the project yet
extend-exclude = ["engines/instrument_price_forecasting.py", "engines/strategy_simple.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear (likely bugs), pyupgrade (modern syntax),
# no print (logging instead), logging calls with lazy formatting
# docstrings required on public modules, classes and functions (not on packages, magic methods, __init__)
select = ["E", "W", "F", "I", "B", "UP", "T20", "G", "LOG", "D1"]
ignore = ["D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
# test names describe the tests
"tests/*" = ["D1"]
