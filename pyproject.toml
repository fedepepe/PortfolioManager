[project]
name = "portfolio-manager"
version = "0.1.0"
description = "Dashboard to track, backtest and optimize DeGiro portfolios"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the project modules are imported from the repository root
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
# work in progress of the author, not part of the project yet
extend-exclude = ["engines/instrument_price_forecasting.py", "engines/strategy_simple.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear (likely bugs), pyupgrade (modern syntax)
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# modules not used by the app, to be repaired or removed in the cleanup step
"engines/plotting.py" = ["F821", "B008", "E501", "UP007", "UP031"]
"engines/portfolio_backtesting.py" = ["F821", "E501"]
"portfolio/portfolio_report.py" = ["F821", "E501", "UP031"]
"degiro/product_screening.py" = ["E501"]
